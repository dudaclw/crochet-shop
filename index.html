<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3a1216" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" />
    <title>Mia's Crochet — crochê feito à mão</title>
    <meta name="description" content="Crochê feito à mão, com tempo e carinho. Peças de pronta entrega e sob encomenda, combinadas pelo WhatsApp." />
    <!-- Prévia de link (WhatsApp/Instagram). Robôs não rodam JS, então vale para todas as páginas.
         og:image precisa de URL absoluta: vem de VITE_SITE_URL (ver .env.example). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mia's Crochet — crochê feito à mão" />
    <meta property="og:description" content="Peças de pronta entrega e sob encomenda, combinadas pelo WhatsApp." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
